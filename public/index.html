<main><h1>Arbeidstid</h1>
<form id="login">
<label for="email">E-postadresse</label><input id="email" type="email" autocomplete="email" required>
<button type="submit" id="loginButton">Send innloggingslenke</button>
<button type="button" id="finishLogin" hidden>Fullfør innlogging</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
<section id="calendar" hidden>

<h2 id="week"></h2>
<div class="actions"><button id="prev">Forrige uke</button><button id="next">Neste uke</button><button id="logout">Logg ut</button></div>
<h3>Romoversikt</h3><p class="room-note" id="roomNote"></p><div class="room-overview" id="days" tabindex="0" aria-label="Rull sidelengs for å se hele uken"></div>
<section id="temple" class="temple" hidden><h2>Templet</h2><p id="templeStatus" hidden></p><div class="days" id="templeDays"></div></section>
<form id="reservation" hidden>
<h3 id="reservationTitle">Reserver arbeidstid</h3>
<p id="hoursWarning" class="room-note" hidden><strong>Viktig:</strong> Endringen sjekker ikke om kunder har booket time. Flytt eller avlys eventuelle bookinger i Wix <em>før</em> du endrer tiden.</p>
<label for="room">Rom</label><select id="room"><option value="mandibula">Mandibula</option><option value="maxilla">Maxilla</option></select>
<label for="reservationDate">Dato</label><input id="reservationDate" type="date" required>
<label for="from">Fra</label><input id="from" type="time" required>
<label for="to">Til</label><input id="to" type="time" required>
<button id="reserve" type="submit">Reserver</button> <button type="button" id="cancelHoursEdit" hidden>Avbryt endring</button><p id="reservationStatus" role="status"></p>
</form>
<section id="rentals" hidden>
<h3>Romleie</h3>
<form id="tenantForm"><label for="tenantName">Ny leietaker</label><input id="tenantName" maxlength="60" required><button>Legg til</button></form>
<form id="rentalForm">
<label for="tenant">Leietaker</label><select id="tenant" required></select>
<label for="rentalRoom">Rom</label><select id="rentalRoom"><option value="mandibula">Mandibula</option><option value="maxilla">Maxilla</option></select>
<label for="rentalDate">Dato</label><input id="rentalDate" type="date" required>
<label for="rentalFrom">Fra</label><input id="rentalFrom" type="time" required>
<label for="rentalTo">Til</label><input id="rentalTo" type="time" required>
<button id="saveRental">Reserver romleie</button>
<button type="button" id="cancelRentalEdit" hidden>Avbryt redigering</button>
</form>
<p id="rentalStatus" role="status"></p>
</section>

<details id="memberAdmin" hidden><summary>Administrer brukere</summary>

<form id="memberForm">
<label for="memberName">Navn</label><input id="memberName" maxlength="60" required>
<label for="memberEmail">E-postadresse</label><input id="memberEmail" type="email" maxlength="254" required>
<label for="memberRole">Rolle</label><select id="memberRole"><option value="therapist">Terapeut</option><option value="rental-manager">Romansvarlig</option></select>
<button>Gi tilgang</button>
</form>
<p id="memberStatus" role="status"></p><ul id="members"></ul>
</details><details id="issues" hidden><summary id="issueSummary"></summary><ul id="issueList"></ul></details>
</section></main>
<script>
const $=id=>document.getElementById(id);
const dateFormat=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Oslo',year:'numeric',month:'2-digit',day:'2-digit'});
const label=new Intl.DateTimeFormat('nb-NO',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'});
const today=dateFormat.format(new Date());
const shift=(day,n)=>new Date(Date.parse(day+'T12:00:00Z')+n*86400000).toISOString().slice(0,10);
let week=shift(today,-((new Date(today).getUTCDay()+6)%7));
let revision=0;
async function api(body){
 const response=await fetch('/api/calendar'+(body?'':'?week='+week),body?{
  method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)
 }:{});
 const data=await response.json();
 return {status:response.status,data};
}
const initialUrl=new URL(window.location.href);
let loginToken=initialUrl.searchParams.get('token_hash');
if(loginToken){
 initialUrl.searchParams.delete('token_hash');
 history.replaceState(null,'',initialUrl.pathname+initialUrl.search+initialUrl.hash);
 $('finishLogin').hidden=false;
}
async function memberAction(input,button){
 button.disabled=true;
 try{
  const {status,data}=await api(input);
  $('memberStatus').textContent=status===200?'Tilgangen er oppdatert.':data.error??'Kunne ikke oppdatere tilgang.';
  if(status===200){
   if(input.action==='add-member')$('memberForm').reset();
   await load();
  }
 }catch{$('memberStatus').textContent='Kunne ikke oppdatere tilgang.';}
 finally{button.disabled=false;}
}
function renderMembers(members){
 $('memberAdmin').hidden=!Array.isArray(members);
 $('members').replaceChildren(...(members??[]).map(member=>{
  const li=document.createElement('li');
  const remove=document.createElement('button');
  remove.textContent='Fjern tilgang';
  remove.onclick=()=>{
   if(window.confirm('Fjerne tilgangen for '+member.name+'?'))memberAction({action:'remove-member',email:member.email},remove);
  };
  li.append(document.createTextNode(member.name+' · '+member.email+' '),remove);
  return li;
 }));
}
$('memberForm').onsubmit=event=>{
 event.preventDefault();
 memberAction({action:'add-member',name:$('memberName').value,email:$('memberEmail').value,role:$('memberRole').value},event.submitter);
};

const roomLabels={mandibula:'Mandibula',maxilla:'Maxilla'};
function roomControl(hour,canAssign){
 const group=document.createElement('div');
 if(!canAssign){
  group.textContent=roomLabels[hour.room]??'Rom ikke tildelt';
  return group;
 }
 const select=document.createElement('select');
 select.setAttribute('aria-label','Rom for '+hour.name+' kl. '+hour.start.slice(11,16));
 const placeholder=new Option('Velg rom','',false,!hour.room);
 placeholder.disabled=true;
 select.append(placeholder,...Object.entries(roomLabels).map(([room,name])=>new Option(name,room,false,hour.room===room)));
 select.onchange=async()=>{
  select.disabled=true;
  try{
   const {status,data}=await api({action:'assign-room',week,id:hour.id,start:hour.start,end:hour.end,room:select.value});
   if(status!==200){
    $('status').textContent=data.error??'Kunne ikke lagre rom.';
    select.value=hour.room??'';
    return;
   }
   await load();
  }catch{
   $('status').textContent='Kunne ikke lagre rom. Last uken på nytt.';
   select.value=hour.room??'';
  }finally{select.disabled=false;}
 };
 group.append(select);
 return group;
}
let editingRental=null;
function clearRentalEdit(){
 editingRental=null;
 $('saveRental').textContent='Reserver romleie';
 $('cancelRentalEdit').hidden=true;
}
function rentalControls(hour){
 const group=document.createElement('div');
 const edit=document.createElement('button');
 edit.textContent='Endre';
 edit.onclick=()=>{
  editingRental=hour.rental.id;
  $('tenant').value=hour.rental.tenantId;
  $('rentalRoom').value=hour.room;
  $('rentalDate').value=hour.start.slice(0,10);
  $('rentalFrom').value=hour.start.slice(11,16);
  $('rentalTo').value=hour.end.slice(11,16);
  $('saveRental').textContent='Lagre endring';
  $('cancelRentalEdit').hidden=false;
  $('tenant').focus();
 };
 const release=document.createElement('button');
 release.textContent='Frigi';
 release.onclick=()=>{
  if(window.confirm('Frigi denne romleien?'))rentalAction({action:'release-rental',id:hour.rental.id},release);
 };
 group.append(edit,release);
 return group;
}
const bookingBlocks=[['08:00','12:30'],['12:45','17:15'],['17:30','22:00']];
function dayEntries(hours,day){
 const start=day+'T00:00:00',end=shift(day,1)+'T00:00:00';
 return hours.filter(x=>x.start<end&&x.end>start).map(hour=>({
  ...hour, effectiveStart:hour.start<start?'00:00':hour.start.slice(11,16),
  effectiveEnd:hour.end>=end?'24:00':hour.end.slice(11,16),
 })).sort((a,b)=>a.effectiveStart.localeCompare(b.effectiveStart));
}
function freeIntervals(rows){
 return bookingBlocks.flatMap(([start,end])=>{
  const free=[];
  let cursor=start;
  for(const row of rows){
   if(row.effectiveEnd<=cursor||row.effectiveStart>=end)continue;
   if(row.effectiveStart>cursor)free.push([cursor,row.effectiveStart]);
   if(row.effectiveEnd>cursor)cursor=row.effectiveEnd;
  }
  if(cursor<end)free.push([cursor,end]);
  return free;
 });
}
function chooseSlot(room,day,start,end){
 if(!$('reservation').hidden){
  clearHoursEdit();
  $('room').value=room;$('reservationDate').value=day;
  $('from').value=start;$('to').value=end;$('from').focus();
 }else if(!$('rentals').hidden){
  clearRentalEdit();
  $('rentalRoom').value=room;$('rentalDate').value=day;
  $('rentalFrom').value=start;$('rentalTo').value=end;$('tenant').focus();
 }
}
let editingHours=null;
function clearHoursEdit(){
 editingHours=null;
 $('reservationTitle').textContent='Reserver arbeidstid';
 $('reserve').textContent='Reserver';
 $('cancelHoursEdit').hidden=true;
 $('hoursWarning').hidden=true;
}
function startHoursEdit(slot){
 editingHours=slot;
 $('reservationTitle').textContent='Endre arbeidstid '+slot.start.slice(11,16)+'–'+slot.end.slice(11,16);
 $('reserve').textContent='Lagre endring';
 $('cancelHoursEdit').hidden=false;
 $('hoursWarning').hidden=false;
 $('reservationStatus').textContent='';
 if(slot.room)$('room').value=slot.room;
 $('reservationDate').value=slot.start.slice(0,10);
 $('from').value=slot.start.slice(11,16);
 $('to').value=slot.end.slice(11,16);
 $('reservation').scrollIntoView({behavior:'smooth',block:'center'});
 $('from').focus();
}
function ownSlotControls(hour){
 const details=document.createElement('details'),summary=document.createElement('summary');
 summary.textContent='Endre arbeidstid';details.append(summary);
 const now=new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Oslo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(new Date()).replace(' ','T');
 for(const slot of hour.slots){
  const row=document.createElement('div');row.className='own-slot';
  const time=document.createElement('small');time.textContent=slot.start.slice(11,16)+'–'+slot.end.slice(11,16);
  row.append(time);
  if(slot.start>now){
   const edit=document.createElement('button');edit.type='button';edit.textContent='Endre';
   edit.onclick=()=>startHoursEdit(slot);
   const release=document.createElement('button');release.type='button';release.textContent='Frigi';
   release.onclick=async()=>{
    if(!window.confirm('Frigi '+time.textContent+'? Tiden fjernes fra arbeidstiden din i Wix.\n\nHar du flyttet eller avlyst eventuelle bookinger i dette tidsrommet? Romkalenderen sjekker ikke dette.'))return;
    release.disabled=true;
    try{
     const {status,data}=await api({action:'release-hours',week,id:slot.id,originalStart:slot.start,originalEnd:slot.end});
     $('reservationStatus').textContent=status===200?'Tiden er frigitt.':data.error??'Kunne ikke frigi tiden.';
     if(status===200){if(editingHours?.id===slot.id)clearHoursEdit();await load();}
    }catch{$('reservationStatus').textContent='Svaret kom ikke frem. Last uken på nytt før du prøver igjen.';}
    finally{release.disabled=false;}
   };
   row.append(edit,release);
  }
  details.append(row);
 }
 return details;
}
function reservationCard(hour,canAssign,canEdit){
 const card=document.createElement('div');
 card.className='booking-card';
 const time=document.createElement('strong');time.textContent=hour.effectiveStart+'–'+hour.effectiveEnd;
 const person=document.createElement('span');person.textContent=hour.name;
 card.append(time,person);
 if(canAssign&&hour.id){
  const details=document.createElement('details'),summary=document.createElement('summary');
  summary.textContent='Romvalg';details.append(summary);
  for(const slot of hour.slots??[hour]){
   const label=document.createElement('small');label.textContent=slot.start.slice(11,16)+'–'+slot.end.slice(11,16);
   details.append(label,roomControl({...slot,name:hour.name},true));
  }
  card.append(details);
 }
 if(canEdit&&hour.own&&hour.slots)card.append(ownSlotControls(hour));
 if(hour.rental)card.append(rentalControls(hour));
 return card;
}
function render(hours,{canAssign,roomsEnabled,canBook,canEdit,unknown=[]}){
 const days=Array.from({length:7},(_,i)=>shift(week,i));
 $('week').textContent=label.format(new Date(days[0]))+' – '+label.format(new Date(days[6]));
 $('roomNote').textContent=!roomsEnabled?'Romfordelingen er midlertidig utilgjengelig.':
  'Hvite felt viser ledig tid. Pauser innenfor en romreservasjon er inkludert.';
 const table=document.createElement('table');
 table.className='room-grid';
 table.setAttribute('aria-label','Bookinger og ledige tider for begge rom');
 const header=table.createTHead().insertRow();
 for(const text of ['Rom',...days.map(day=>label.format(new Date(day)))]){
  const col=document.createElement('th');col.scope='col';col.textContent=text;header.append(col);
 }
 const body=table.createTBody();
 const byDay=days.map(day=>dayEntries(hours,day));
 for(const [room,name] of [...Object.entries(roomLabels),['','Ufordelt arbeidstid']]){
  if(!room&&!hours.some(hour=>!hour.room)&&!unknown.length)continue;
  const tr=body.insertRow();tr.dataset.room=room;
  const title=document.createElement('th');title.scope='row';title.textContent=name;tr.append(title);
  for(const [index,day] of days.entries()){
   const td=tr.insertCell();
   const rows=byDay[index];
   const matching=rows.filter(hour=>(hour.room??'')===room);
   if(!room)matching.push(...dayEntries(unknown,day).map(x=>({...x,name:'Uavklart Wix-tid'})));
   matching.sort((a,b)=>a.effectiveStart.localeCompare(b.effectiveStart));
   for(const hour of matching){const card=reservationCard(hour,canAssign,canEdit);card.dataset.start=hour.effectiveStart;td.append(card);}
   if(!room||!roomsEnabled)continue;
   const blocked=dayEntries(unknown,day);
   const overlapping=rows.filter(x=>x.room===room||!x.room).concat(blocked).sort((a,b)=>a.effectiveStart.localeCompare(b.effectiveStart));
   const free=freeIntervals(overlapping);
   if(!free.length){
    const full=document.createElement('small');full.textContent='Ingen ledig tid';td.append(full);
   }
   for(const [start,end] of free){
    const entry=document.createElement(canBook&&day>=today?'button':'small');
    entry.className='free-slot';entry.textContent='Ledig '+start+'–'+end;
    if(entry.tagName==='BUTTON')entry.onclick=()=>chooseSlot(room,day,start,end);
    const next=[...td.children].find(item=>item.dataset.start>start);
    entry.dataset.start=start;td.insertBefore(entry,next??null);
   }
  }
 }
 $('days').replaceChildren(table);
}
const timeFormat=new Intl.DateTimeFormat('nb-NO',{timeZone:'Europe/Oslo',hour:'2-digit',minute:'2-digit'});
function renderTemple(events){
 $('templeStatus').hidden=Array.isArray(events);
 $('templeStatus').textContent='Stillepunkt-kalenderen er midlertidig utilgjengelig.';
 $('templeDays').replaceChildren();
 if(!Array.isArray(events))return;
 const days=Array.from({length:7},(_,i)=>shift(week,i));
 const panels=days.map(day=>{
  const panel=document.createElement('article');
  const heading=document.createElement('h3');
  heading.textContent=label.format(new Date(day));
  panel.append(heading);
  for(const event of events){
   const start=new Date(event.start),end=new Date(event.end);
   const first=dateFormat.format(start),last=dateFormat.format(new Date(end.getTime()-1));
   if(day<first||day>last)continue;
   const entry=document.createElement('p');
   const time=document.createElement('small');
   const sameDay=dateFormat.format(start)===dateFormat.format(end);
   time.textContent=sameDay?timeFormat.format(start)+'–'+timeFormat.format(end):
    label.format(new Date(first))+' '+timeFormat.format(start)+' – '+label.format(new Date(dateFormat.format(end)))+' '+timeFormat.format(end);
   entry.append(document.createTextNode(event.title),document.createElement('br'),time);
   panel.append(entry);
  }
  return panel;
 });
 $('templeDays').replaceChildren(...panels);
}
function formatPeriod(start,end){
 if(!start||!end)return 'Tidspunkt mangler';
 const startLabel=label.format(new Date(start.slice(0,10)))+' '+start.slice(11,16);
 const endLabel=start.slice(0,10)===end.slice(0,10)?end.slice(11,16):
  label.format(new Date(end.slice(0,10)))+' '+end.slice(11,16);
 return startLabel+'–'+endLabel;
}
function renderIssues(issues=[]){
 $('issues').hidden=!issues.length;
 $('issueSummary').textContent='Arbeidstid i Wix til gjennomgang ('+issues.length+')';
 $('issueList').replaceChildren(...issues.map(issue=>{
  const li=document.createElement('li');
  const period=formatPeriod(issue.start,issue.end);
  const prefix=issue.name?issue.name+': ':'';
  if(issue.type==='overlap')li.textContent=prefix+period+' overlapper '+formatPeriod(issue.otherStart,issue.otherEnd)+'.';
  else if(issue.type==='unknown')li.textContent=period+' · timeplan uten treff i terapeutlisten.';
  else li.textContent=prefix+period+' · ugyldig arbeidstid.';
  return li;
 }));
}
async function load(){
 const request=++revision;
 try{
  const {status,data}=await api();
  if(request!==revision)return;
  $('login').hidden=status===200;
  $('calendar').hidden=$('temple').hidden=status!==200;
  $('status').textContent=status===401?'':data.error??'';
  if(status===200){
   renderMembers(data.members);
   const day=$('reservationDate');
   day.min=week;
   day.max=shift(week,6);
   if(day.value<day.min||day.value>day.max)day.value=week;
   $('reservation').hidden=!data.reservationEnabled;
   $('rentals').hidden=!Array.isArray(data.tenants);
   if(Array.isArray(data.tenants)){
    const tenant=$('tenant').value;
    $('tenant').replaceChildren(...data.tenants.map(person=>new Option(person.name,person.id)));
    if(data.tenants.some(person=>person.id===tenant))$('tenant').value=tenant;
    $('saveRental').disabled=!data.tenants.length;
    const date=$('rentalDate');
    date.min=week;
    date.max=shift(week,6);
    if(date.value<date.min||date.value>date.max)date.value=week;
   }
   render(data.hours,{canAssign:data.roomsEnabled&&data.role==='admin',roomsEnabled:data.roomsEnabled,canBook:data.reservationEnabled||Array.isArray(data.tenants),canEdit:data.reservationEnabled,unknown:data.unassignedBlocks});renderIssues(data.issues);renderTemple(data.temple);}
 }catch{
  if(request===revision)$('status').textContent='Kalenderen er midlertidig utilgjengelig.';
 }
}
$('login').onsubmit=async event=>{
 event.preventDefault();
 $('loginButton').disabled=true;
 try{
  const {data}=await api({action:'request-link',email:$('email').value});
  $('status').textContent=data.error??data.message??'';
 }catch{$('status').textContent='Innloggingen er midlertidig utilgjengelig.';}
 finally{$('loginButton').disabled=false;}
};
$('finishLogin').onclick=async()=>{
 $('finishLogin').disabled=true;
 try{
  const {status,data}=await api({action:'verify-link',tokenHash:loginToken});
  $('status').textContent=data.error??'';
  if(status===200||status===401){
   loginToken=null;
   $('finishLogin').hidden=true;
  }
  if(status===200)await load();
 }catch{$('status').textContent='Innloggingen er midlertidig utilgjengelig.';}
 finally{$('finishLogin').disabled=false;}
};
$('reservation').onsubmit=async event=>{
 event.preventDefault();
 if(editingHours){
  const slot=editingHours;
  if(!window.confirm('Lagre ny tid? Har du flyttet eller avlyst eventuelle bookinger som ikke passer i den nye tiden? Romkalenderen sjekker ikke dette.'))return;
  $('reserve').disabled=true;
  try{
   const {status,data}=await api({action:'update-hours',week,id:slot.id,originalStart:slot.start,originalEnd:slot.end,
    room:$('room').value,date:$('reservationDate').value,from:$('from').value,to:$('to').value});
   $('reservationStatus').textContent=status===200?'Arbeidstiden er endret.':data.error??'Kunne ikke endre tiden.';
   if(status===200){clearHoursEdit();await load();}
  }catch{$('reservationStatus').textContent='Svaret kom ikke frem. Last uken på nytt før du prøver igjen.';}
  finally{$('reserve').disabled=false;}
  return;
 }
 const input={action:'reserve-room',week,room:$('room').value,date:$('reservationDate').value,from:$('from').value,to:$('to').value};
 const key='cranio-reservation:'+JSON.stringify(input);
 let id=sessionStorage.getItem(key);
 if(!id){
  id=crypto.randomUUID();
  sessionStorage.setItem(key,id);
 }
 $('reserve').disabled=true;
 try{
  const {status,data}=await api({...input,id});
  $('reservationStatus').textContent=status===200?'Arbeidstiden er reservert.':data.error??'Kunne ikke reservere tiden.';
  if(status===200)await load();
 }catch{$('reservationStatus').textContent='Svaret kom ikke frem. Prøv samme reservasjon igjen.';}
 finally{$('reserve').disabled=false;}
};
async function rentalAction(input,button){
 button.disabled=true;
 try{
  const {status,data}=await api(input);
  $('rentalStatus').textContent=status===200?'Romleien er oppdatert.':data.error??'Kunne ikke lagre romleie.';
  if(status!==200)return;
  if(input.action==='add-tenant')$('tenantName').value='';
  clearRentalEdit();
  await load();
 }catch{$('rentalStatus').textContent='Kunne ikke lagre. Last inn uken på nytt.';}
 finally{button.disabled=false;}
}
$('tenantForm').onsubmit=event=>{
 event.preventDefault();
 rentalAction({action:'add-tenant',name:$('tenantName').value},event.submitter);
};
$('rentalForm').onsubmit=event=>{
 event.preventDefault();
 rentalAction({
  action:editingRental?'update-rental':'reserve-rental',id:editingRental??crypto.randomUUID(),
  week,tenantId:$('tenant').value,room:$('rentalRoom').value,date:$('rentalDate').value,
  from:$('rentalFrom').value,to:$('rentalTo').value
 },event.submitter);
};
$('cancelRentalEdit').onclick=clearRentalEdit;
$('cancelHoursEdit').onclick=()=>{clearHoursEdit();$('reservationStatus').textContent='';};
$('prev').onclick=()=>{clearRentalEdit();clearHoursEdit();week=shift(week,-7);load();};
$('next').onclick=()=>{clearRentalEdit();clearHoursEdit();week=shift(week,7);load();};
$('logout').onclick=async()=>{
 try{
  const {status}=await api({action:'logout'});
  if(status!==200)throw new Error();
  $('days').replaceChildren();
  $('templeDays').replaceChildren();
  renderMembers();
  renderIssues();
  await load();
 }catch{$('status').textContent='Kunne ikke logge ut. Prøv igjen.';}
};
load();
</script></body></html>
